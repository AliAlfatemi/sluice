[project]
name = "sluice"
version = "0.1.0"
description = "Bandwidth-bounded declassification for multi-agent LLM systems (research prototype)."
requires-python = ">=3.10"

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = ["pytest==9.1.1", "hypothesis==6.165.10"]
integration = ["langgraph==1.2.11"]
backend-transformers = ["torch", "transformers", "outlines>=1.0"]

[tool.setuptools.packages.find]
include = ["sluice_v2*"]

[tool.pytest.ini_options]
testpaths = ["tests", "sluice_v2/tests", "integrations"]
