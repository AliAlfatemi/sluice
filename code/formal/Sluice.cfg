SPECIFICATION Spec

CONSTANTS
  Objects = {o1, o2}
  Gates = {g1, g2, g3, g4, g5}
  Object1 = o1
  Object2 = o2
  Object1Gates = {g1, g2, g3, g5}
  Epoch0Gates = {g1, g2, g4, g5}
  Epoch1Gates = {g3}
  Epoch2Gates = {}
  ChargedCost = 3
  \* InitialCap = 7 is the smallest cap that lets one of RaceSuccessorA/B
  \* actually be claimed after RacePredecessor (3 for RacePredecessor's own
  \* entry charge + 4 for a successor's content-plus-selection charge),
  \* so AtMostOneSuccessorClaimed is checked non-vacuously: TLC must reach
  \* states where a successor claim really can succeed, not just states
  \* where both are always rejected for budget regardless of authorization.
  InitialCap = 7
  NewCaps = {2, 4}
  MaxEpoch = 2
  SuccessfulOutcomes = {ok_a, ok_b}
  RacePredecessor = g1
  RaceSuccessorA = g2
  RaceSuccessorB = g5
  SelectionCost <- SelectionCostDef

INVARIANT TypeOK
INVARIANT NoOverspend
INVARIANT SpendMatchesAtomicClaims
INVARIANT ClaimAndChargeAtomic
INVARIANT GateLifecycleOK
INVARIANT BackendOutcomeWasCharged
INVARIANT ReauthHasConcreteCause
INVARIANT NoBudgetOverwrite
INVARIANT EpochRowsAreContiguous
INVARIANT BudgetRowsWellFormed
INVARIANT AtMostOneSuccessorClaimed
INVARIANT LastGateWasConsumed

PROPERTY EpochNeverDecreases
PROPERTY ConsumedNeverClears
PROPERTY BudgetRowsNeverDisappear
PROPERTY ChainOptedInIsSticky
