SPECIFICATION Spec

CONSTRAINT ModelStateConstraint

CONSTANTS
  Domains = {d1, d2}
  Objects = {o1, o2, o3}
  Workflows = {w1, w2}
  Agents = {a1, a2}
  Nonces = {n1, n2}
  Delegations = {dg1, dg2}
  ReauthGrants = {rg1, rg2}
  Gates = {p, sa, sb, cross, shared, d2gate, epoch1}
  Capabilities = {c1, c2}
  Redeemers = {r1, r2}

  DomainOne = d1
  DomainTwo = d2
  ObjectOne = o1
  ObjectTwo = o2
  ObjectThree = o3
  WorkflowOne = w1
  WorkflowTwo = w2
  AgentOne = a1
  AgentTwo = a2
  DelegationOne = dg1
  DelegationTwo = dg2
  ReauthOne = rg1
  ReauthTwo = rg2
  RacePredecessor = p
  RaceSuccessorA = sa
  RaceSuccessorB = sb
  CrossDomainSuccessor = cross
  SharedObjectGate = shared
  DomainTwoGate = d2gate
  EpochOneGate = epoch1
  CapabilityOne = c1
  CapabilityTwo = c2
  RedeemerOne = r1
  RedeemerTwo = r2

  InitialBudget = 3
  InitialHorizon = 3
  EventCharge = 1
  ReauthBudgetIncrement = 2
  ReauthAttemptIncrement = 2
  MaxEpoch = 1

INVARIANT TypeOK
INVARIANT NoBudgetOverspend
INVARIANT NoDoubleGateClaim
INVARIANT NoDoubleNonceConsumption
INVARIANT NoDoubleDelegationRedemption
INVARIANT AuthorizationConsumedOnlyWithSuccessfulClaim
INVARIANT NoCrossDomainSuccessorAuthorization
INVARIANT SuccessorMutualExclusion
INVARIANT AttemptHorizonRespected
INVARIANT CapabilityRedeemedAtMostOnce
INVARIANT RedeemerBindingPreserved
INVARIANT EpochMonotonicity
INVARIANT LifetimeBudgetComposition
INVARIANT AuditStartExistsForEveryCommittedClaim

INVARIANT AtomicClaimChargeAndAudit
INVARIANT FailedClaimRollsBackAuthorization
INVARIANT AuthorizationVersionConsistent
INVARIANT EveryAttemptHasFixedCharge
INVARIANT NoReauthorizationReplay
INVARIANT SharedDomainAccounting
INVARIANT ClosedDomainsAreFullyAccounted

PROPERTY EpochNeverDecreases
PROPERTY BudgetsAndHorizonsNeverDecrease
PROPERTY ConsumedAuthorizationsNeverClear
